

"These are the choices for various units of ingredients measurements"
enum INGREDIENT_MEASUREMENT_UNITS{
  "Ounce"
  OZ
  "Pound"
  LB
  "Gram"
  G
  "Kilogram"
  KG
  "Tablespoon"
  TBSP
  "Teaspoon"
  TSP
  "Cup"
  C
  "Pint"
  PT
  "Gallon"
  GAL
  "Liter"
  L
  "Mililiter"
  ML
  "Dozen"
  DOZ
  "Quart"
  QT
  "Loaf"
  LOAF
  "Bar"
  BAR
  "Package"
  PACKAGE
  "Piece"
  PIECE
}

"Ingredient schema."
type Ingredients{
  name: String
  quantity: Int
  unit: String
}

"Ingredients inputted for recipe creation or modification would be following this schema"
input IngredientsInput{
  name: String!
  quantity: Int!
  unit: INGREDIENT_MEASUREMENT_UNITS
}

"Recipe status"
enum RECIPE_STATUS{
  DRAFT
  PUBLISHED
}

"Time input schema for cooking and preparation time"
input TimeInput{
  hour: Int
  minute: Int!
  seconds: Int
}

"Schema representing data body for recipe creation"
input CreateRecipeInput{
  title: String!
  description: String!
  ingredients: [IngredientsInput]!
  instructions: [String!]!
  preparation_time: TimeInput!
  cooking_time: TimeInput!
  servings: Int!
  images: [String!]!
  tags: [String!]!
  video: String
  thumbnail: String
}

"Schema representing data body for recipe modification"
input EditRecipeInput{
  id: String!
  title: String
  description: String
  ingredients: [IngredientsInput]
  instructions: [String]
  preparation_time: TimeInput
  cooking_time: TimeInput
  servings: Int
  images: [String]
  tags: [String]
  video: String
  thumbnail: String
  status: RECIPE_STATUS
}

"Chef schema on response"
type Chef{
  username: String
  first_name: String
  last_name: String
  vote_strength: Int
  is_verified: Boolean
}


"Schema type for recipe nutritional value"
type NutritionalValue{
  calories: String  # using String type because of the units attached to the numbers
  fat: String
  cholesterol: String
  sodium: String
  carbohydrates: String
  fiber: String
  sugar: String
  protein: String
  potassium: String
}

"Recipe schema on response"
type Recipe{
  id: Int
  title: String
  description: String
  ingredients: [Ingredients]
  instructions: [String]
  preparationTime: String
  cookingTime: String
  servings: Int
  images: [String]
  tags: [String]
  nutritionalValue: NutritionalValue
  video: String
  thumbnail: String
  chef: Chef
  status: RECIPE_STATUS
  created: String
  published: String
}


"Response for single recipe mutation and query operation"
type RecipeResponse{
  message: String
  recipe: Recipe
  # likes: Int
  "number of up-votes"
  up_votes: Int
  "details of up-voters"
  up_voters: [Chef]
  "number of down-votes"
  down_votes: Int
  "details of down-voters"
  downVoters: [Chef]
}

"Response for a feed of recipes tailored to the preferences of the current user"
type RecipeFeedResponse{
  message: String
  feed: [Recipe]
  "suggested chefs to follow if user is not following any chef to populate feed"
  suggestions: [String]
}


type RecipeSearchResponse{
  message: String
  results: [Recipe]
}

"This schema will be used as input for commenting on a recipe, and commenting on a comment"
input RecipeCommentInput{
  id: Int!
  content: String!
}


type Comment{
  id: Int
  writer: Chef
  content: String
  created: String
}

"This schema will be used as a schema response on the comment created on a recipe, and on a comment"
type RecipeCommentResponse{
  message: String
  comment: Comment
}


type RecipeCommentsResponse{
  message: String
  comments: [Comment]
}


"The query resolvers"
type Query{
  recipeTags: [String]!
  recipeFeed: RecipeFeedResponse
  # singleRecipe(pk: Int): RecipeResponse
  myDrafts: [Recipe]
  myPublishedRecipes: [Recipe]
  draft(pk: Int): Recipe

  "search functionality for recipes"
  search(query: String): RecipeSearchResponse
  "fetch comments to a recipe"
  recipeComments(pk: Int): RecipeCommentsResponse

  "fetch child comments to a parent comment"
  commentReplies(pk: Int): RecipeCommentsResponse
  mySavedRecipes: [Recipe]

  "fetch published recipes by a chef's username"
  chefPublishedRecipes(username: String): [Recipe]
}

"The mutation resolvers"
type Mutation{
  createRecipe(input: CreateRecipeInput): RecipeResponse
  editRecipe(input: EditRecipeInput): RecipeResponse
  deleteRecipe(pk: Int): String
  commentOnRecipe(input: RecipeCommentInput): RecipeCommentResponse
  upVoteRecipe(pk: Int): String
  downVoteRecipe(pk: Int): String

  "the id property of the RecipeCommentInput here is the pk key of the comment model the user will be commenting on "
  commentOnComment(input: RecipeCommentInput): RecipeCommentResponse

  "save recipe for later interaction"
  saveForLater(pk: Int): String
}

"This operation works for a single recipe, in order to know the number of likes it has in real time"
type Subscription{
  singleRecipe(pk: Int): RecipeResponse
}
